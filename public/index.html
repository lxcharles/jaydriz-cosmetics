      // ==========================================
      function OrderConfirmationModal({ order, onClose, onConfirmSuccess }) {
        const [items, setItems] = useState(() => {
          return JSON.parse(JSON.stringify(order.items || []));
        });
        const businessNumber = "2349162093880";

        const handleUpdateShadeQty = (productIdx, shadeIdx, delta) => {
          setItems((prevItems) => {
            const next = JSON.parse(JSON.stringify(prevItems));
            const item = next[productIdx];
            if (!item || !item.shades || !item.shades[shadeIdx]) return prevItems;

            const currentQty = item.shades[shadeIdx].quantity;
            const newQty = currentQty + delta;

            if (newQty <= 0) {
              item.shades.splice(shadeIdx, 1);
              if (item.shades.length === 0) {
                next.splice(productIdx, 1);
              }
            } else {
              item.shades[shadeIdx].quantity = newQty;
            }
            return next;
          });
        };

        const handleAddShadeToProduct = (productIdx, shadeToAdd) => {
          setItems((prevItems) => {
            const next = JSON.parse(JSON.stringify(prevItems));
            const item = next[productIdx];
            if (!item || !item.shades) return prevItems;
            const existingIdx = item.shades.findIndex((s) => s.shade === shadeToAdd);
            if (existingIdx >= 0) {
              item.shades[existingIdx].quantity += 1;
            } else {
              item.shades.push({ shade: shadeToAdd, quantity: 1 });
            }
            return next;
          });
        };

        const handleUpdateProductQty = (productIdx, delta) => {
          setItems((prevItems) => {
            const next = JSON.parse(JSON.stringify(prevItems));
            const item = next[productIdx];
            if (!item) return prevItems;
            const newQty = (item.quantity || 1) + delta;
            if (newQty <= 0) {
              next.splice(productIdx, 1);
            } else {
              item.quantity = newQty;
            }
            return next;
          });
        };

        const handleRemoveProduct = (productIdx) => {
          setItems((prevItems) => {
            const next = JSON.parse(JSON.stringify(prevItems));
            next.splice(productIdx, 1);
            return next;
          });
        };

        const calculateTotalUnits = () => {
          return items.reduce((total, item) => {
            if (item.shades && item.shades.length > 0) {
              return total + item.shades.reduce((sum, s) => sum + s.quantity, 0);
            }
            return total + (item.quantity || 1);
          }, 0);
        };

        const calculateGrandTotal = () => {
          return items.reduce((total, item) => {
            const productUnits = item.shades && item.shades.length > 0
              ? item.shades.reduce((sum, s) => sum + s.quantity, 0)
              : (item.quantity || 1);
            return total + (productUnits * item.product.price);
          }, 0);
        };

        const totalUnits = calculateTotalUnits();
        const grandTotal = calculateGrandTotal();

        const handleFinalizeWhatsAppOrder = () => {
          if (items.length === 0) return;

          const itemsText = items.map((item, index) => {
            const unitPrice = item.product.price;
            const formattedUnitPrice = `₦${unitPrice.toLocaleString("en-NG")}`;

            if (item.shades && item.shades.length > 0) {
              const productUnits = item.shades.reduce((sum, s) => sum + s.quantity, 0);
              const productSubtotal = productUnits * unitPrice;
              const shadeLines = item.shades.map((s) => {
                const shadeCost = s.quantity * unitPrice;
                return `   • ${formatShadeLabel(s.shade)}: ${s.quantity} unit${s.quantity > 1 ? "s" : ""} (₦${shadeCost.toLocaleString("en-NG")})`;
              }).join("\n");

              return `${index + 1}. *${item.product.name}* [${item.product.category}]\n   • Unit Price: ${formattedUnitPrice} each (1 shade = 1 unit)\n   • Selected Shades (${item.shades.length} shades, ${productUnits} total units):\n${shadeLines}\n   • Product Subtotal: ${productUnits} unit${productUnits > 1 ? "s" : ""} = ₦${productSubtotal.toLocaleString("en-NG")}`;
            } else {
              const qty = item.quantity || 1;
              const productSubtotal = qty * unitPrice;
              return `${index + 1}. *${item.product.name}* [${item.product.category}]\n   • Unit Price: ${formattedUnitPrice} each\n   • Quantity: ${qty} unit${qty > 1 ? "s" : ""}\n   • Product Subtotal: ${qty} unit${qty > 1 ? "s" : ""} = ₦${productSubtotal.toLocaleString("en-NG")}`;
            }
          }).join("\n\n");

          const isDirect = items.length === 1 && !order.source?.includes("cart");
          const titleLine = isDirect
            ? "🛍️ *JAYDRIZ COSMETICS — ORDER CONFIRMATION*"
            : "🛍️ *JAYDRIZ COSMETICS — MASTER BAG ORDER CONFIRMATION*";

          const lines = [
            titleLine,
            "",
            `*Order Details (${items.length} product${items.length > 1 ? "s" : ""}, ${totalUnits} total unit${totalUnits > 1 ? "s" : ""}):*`,
            "----------------------------------------",
            itemsText,
            "----------------------------------------",
            `*Total Units Ordered:* ${totalUnits} unit${totalUnits > 1 ? "s" : ""}`,
            `*Total Order Price:* ₦${grandTotal.toLocaleString("en-NG")}`,
            "",
            "Kindly confirm item availability, share your official bank account details, and coordinate payment & delivery. Thank you!"
          ];

          const message = lines.join("\n");
          const waUrl = `https://wa.me/${businessNumber}?text=${encodeURIComponent(message)}`;
          window.open(waUrl, "_blank");

          if (onConfirmSuccess) {
            onConfirmSuccess(items);
          }
          onClose();
        };

        return (
          <div className="fixed inset-0 z-[120] flex items-center justify-center p-3 sm:p-6 bg-black/60 backdrop-blur-xs font-sans">
            <div className="relative w-full max-w-2xl bg-white rounded-lg shadow-2xl flex flex-col max-h-[92vh] overflow-hidden border border-neutral-200">
              {/* Header */}
              <div className="p-5 sm:p-6 border-b border-neutral-100 flex items-center justify-between bg-white shrink-0">
                <div className="space-y-1">
                  <div className="flex items-center space-x-2">
                    <span className="text-[9px] uppercase tracking-[0.25em] font-extrabold text-[#806B5F] bg-amber-50 px-2.5 py-0.5 rounded-full border border-amber-200/60">
                      Step: Pre-WhatsApp Check
                    </span>
                  </div>
                  <h2 className="font-display text-base sm:text-lg font-black tracking-wider uppercase text-black">
                    Confirm Your Order
                  </h2>
                </div>
                <button
                  onClick={onClose}
                  className="p-2 hover:bg-neutral-100 rounded-full text-neutral-400 hover:text-black transition-colors cursor-pointer"
                  aria-label="Close confirmation"
                >
                  <X size={18} />
                </button>
              </div>

              {/* Informational Banner */}
              <div className="bg-amber-50/90 border-b border-amber-200/50 px-5 py-2.5 flex items-center gap-2 text-xs text-amber-900 shrink-0">
                <span className="font-bold shrink-0">💡 1 Shade = 1 Unit:</span>
                <span className="text-[11px] leading-tight text-amber-800">
                  Each shade counts as 1 unit. Use <strong>+</strong> or <strong>-</strong> on each shade and product to adjust your order before messaging WhatsApp.
                </span>
              </div>

              {/* Scrollable Item List */}
              <div className="flex-grow overflow-y-auto p-5 sm:p-6 space-y-5">
                {items.length === 0 ? (
                  <div className="py-16 text-center space-y-4">
                    <ShoppingBag size={32} className="text-gray-300 mx-auto" />
                    <p className="text-sm font-semibold text-neutral-700">All items have been removed from this order.</p>
                    <button
                      onClick={onClose}
                      className="px-6 py-2.5 bg-black text-white text-xs font-bold uppercase tracking-wider rounded-sm hover:bg-neutral-800 transition-colors cursor-pointer"
                    >
                      Return to Shop
                    </button>
                  </div>
                ) : (
                  items.map((item, pIdx) => {
                    const hasShades = item.shades && item.shades.length > 0;
                    const productUnits = hasShades
                      ? item.shades.reduce((sum, s) => sum + s.quantity, 0)
                      : (item.quantity || 1);
                    const productSubtotal = productUnits * item.product.price;
                    const selectedShadeIds = hasShades ? item.shades.map((s) => s.shade) : [];
                    const unselectedShades = (item.product.shades || []).filter((s) => !selectedShadeIds.includes(s));

                    return (
                      <div
                        key={item.product.id + "_" + pIdx}
                        className="border border-neutral-200/90 rounded-md p-4 bg-white shadow-xs space-y-3.5"
                      >
                        {/* Product Header */}
                        <div className="flex items-start gap-3.5 justify-between">
                          <img
                            src={item.product.image}
                            alt={item.product.name}
                            className="w-16 h-18 sm:w-18 sm:h-20 object-cover rounded-xs border border-neutral-150 shrink-0 bg-neutral-100"
                          />
                          <div className="flex-grow min-w-0">
                            <span className="text-[9px] uppercase tracking-widest font-extrabold text-[#806B5F]">
                              {item.product.category}
                            </span>
                            <h3 className="text-sm font-bold uppercase tracking-wide text-neutral-900 truncate">
                              {item.product.name}
                            </h3>
                            <p className="text-xs font-medium text-neutral-500 mt-0.5">
                              ₦{item.product.price.toLocaleString("en-NG")} per unit {hasShades && <span className="text-[10px] text-neutral-400 font-mono">(1 shade = 1 unit)</span>}
                            </p>
                          </div>
                          <button
                            onClick={() => handleRemoveProduct(pIdx)}
                            className="p-1.5 text-neutral-400 hover:text-red-600 transition-colors rounded-xs hover:bg-red-50 cursor-pointer"
                            title="Remove entire product from order"
                          >
                            <Trash2 size={16} />
                          </button>
                        </div>

                        {/* If product has shades: show shade list with + and - */}
                        {hasShades ? (
                          <div className="space-y-2 pt-1 border-t border-neutral-100">
                            <div className="flex items-center justify-between text-[10px] uppercase tracking-widest font-bold text-neutral-400">
                              <span>Selected Shades & Units ({item.shades.length}):</span>
                              <span className="text-[#806B5F] font-mono">{productUnits} Units</span>
                            </div>

                            <div className="space-y-1.5">
                              {item.shades.map((shadeObj, sIdx) => {
                                const shadeColor = getShadeColor(shadeObj.shade);
                                const shadePrice = shadeObj.quantity * item.product.price;

                                return (
                                  <div
                                    key={shadeObj.shade}
                                    className="flex items-center justify-between bg-neutral-50 border border-neutral-200/70 rounded-xs p-2.5 gap-2 text-xs"
                                  >
                                    <div className="flex items-center space-x-2.5 min-w-0">
                                      <span
                                        className="w-4 h-4 rounded-full border border-neutral-200 shrink-0 shadow-2xs"
                                        style={{ backgroundColor: shadeColor }}
                                      ></span>
                                      <span className="font-semibold text-neutral-800 truncate">
                                        {formatShadeLabel(shadeObj.shade)}
                                      </span>
                                    </div>

                                    <div className="flex items-center gap-3 shrink-0">
                                      <div className="flex items-center border border-neutral-300 rounded-xs bg-white shadow-3xs overflow-hidden">
                                        <button
                                          onClick={() => handleUpdateShadeQty(pIdx, sIdx, -1)}
                                          className="px-2.5 py-1 text-xs font-bold hover:bg-neutral-100 transition-colors text-neutral-700 cursor-pointer"
                                          title={shadeObj.quantity === 1 ? "Remove this shade" : "Decrease units"}
                                        >
                                          {shadeObj.quantity === 1 ? <Trash2 size={12} className="text-red-500" /> : <Minus size={12} />}
                                        </button>
                                        <span className="px-2.5 py-1 text-xs font-bold font-mono text-black min-w-[28px] text-center bg-white">
                                          {shadeObj.quantity}
                                        </span>
                                        <button
                                          onClick={() => handleUpdateShadeQty(pIdx, sIdx, 1)}
                                          className="px-2.5 py-1 text-xs font-bold hover:bg-neutral-100 transition-colors text-neutral-700 cursor-pointer"
                                          title="Add more units for this shade"
                                        >
                                          <Plus size={12} />
                                        </button>
                                      </div>

                                      <span className="font-mono font-bold text-xs text-neutral-700 min-w-[65px] text-right">
                                        ₦{shadePrice.toLocaleString("en-NG")}
                                      </span>
                                    </div>
                                  </div>
                                );
                              })}
                            </div>

                            {/* Option to add more shades from this product */}
                            {unselectedShades.length > 0 && (
                              <div className="pt-2">
                                <span className="text-[9px] uppercase tracking-widest text-neutral-400 font-bold block mb-1.5">
                                  + Add Another Shade from {item.product.name}:
                                </span>
                                <div className="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto no-scrollbar py-1">
                                  {unselectedShades.map((uShade) => (
                                    <button
                                      key={uShade}
                                      onClick={() => handleAddShadeToProduct(pIdx, uShade)}
                                      className="inline-flex items-center space-x-1.5 bg-white hover:bg-neutral-100 border border-neutral-300 hover:border-black px-2.5 py-1 rounded-full text-[10px] font-semibold text-neutral-800 transition-all cursor-pointer shadow-3xs"
                                      title={`Add ${formatShadeLabel(uShade)}`}
                                    >
                                      <span
                                        className="w-2.5 h-2.5 rounded-full border border-neutral-200 shrink-0"
                                        style={{ backgroundColor: getShadeColor(uShade) }}
                                      ></span>
                                      <span>+ {formatShadeLabel(uShade)}</span>
                                    </button>
                                  ))}
                                </div>
                              </div>
                            )}

                            {/* Product Subtotal */}
                            <div className="flex items-center justify-between pt-2 border-t border-neutral-150 text-xs">
                              <span className="text-neutral-500 font-medium">
                                Product Subtotal ({productUnits} unit{productUnits > 1 ? "s" : ""}):
                              </span>
                              <span className="font-mono font-bold text-neutral-900">
                                ₦{productSubtotal.toLocaleString("en-NG")}
                              </span>
                            </div>
                          </div>
                        ) : (
                          <div className="flex items-center justify-between pt-2 border-t border-neutral-100">
                            <span className="text-xs text-neutral-500 font-medium">Quantity (Units):</span>
                            <div className="flex items-center gap-3">
                              <div className="flex items-center border border-neutral-300 rounded-xs bg-white shadow-3xs overflow-hidden">
                                <button
                                  onClick={() => handleUpdateProductQty(pIdx, -1)}
                                  className="px-2.5 py-1 text-xs font-bold hover:bg-neutral-100 transition-colors text-neutral-700 cursor-pointer"
                                  title={item.quantity === 1 ? "Remove product" : "Decrease units"}
                                >
                                  {item.quantity === 1 ? <Trash2 size={12} className="text-red-500" /> : <Minus size={12} />}
                                </button>
                                <span className="px-3 py-1 text-xs font-bold font-mono text-black min-w-[28px] text-center bg-white">
                                  {item.quantity || 1}
                                </span>
                                <button
                                  onClick={() => handleUpdateProductQty(pIdx, 1)}
                                  className="px-2.5 py-1 text-xs font-bold hover:bg-neutral-100 transition-colors text-neutral-700 cursor-pointer"
                                  title="Add more units"
                                >
                                  <Plus size={12} />
                                </button>
                              </div>

                              <span className="font-mono font-bold text-xs text-neutral-900 min-w-[65px] text-right">
                                ₦{productSubtotal.toLocaleString("en-NG")}
                              </span>
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })
                )}
              </div>

              {/* Order Summary & Actions */}
              {items.length > 0 && (
                <div className="bg-[#FAF7F5] border-t border-neutral-200 p-5 space-y-4 shrink-0">
                  <div className="space-y-1.5 font-sans">
                    <div className="flex items-center justify-between text-xs text-neutral-600">
                      <span>Total Products:</span>
                      <span className="font-bold text-neutral-800">{items.length} item{items.length > 1 ? "s" : ""}</span>
                    </div>
                    <div className="flex items-center justify-between text-xs text-neutral-600">
                      <span>Total Units (1 Shade = 1 Unit):</span>
                      <span className="font-mono font-bold text-neutral-900 bg-white px-2 py-0.5 rounded-xs border border-neutral-200">
                        {totalUnits} unit{totalUnits > 1 ? "s" : ""}
                      </span>
                    </div>
                    <div className="flex items-center justify-between pt-1 border-t border-neutral-200">
                      <span className="font-display text-xs font-black uppercase tracking-wider text-black">
                        Total Amount:
                      </span>
                      <span className="font-mono text-lg font-black text-black">
                        ₦{grandTotal.toLocaleString("en-NG")}
                      </span>
                    </div>
                  </div>

                  <div className="flex flex-col sm:flex-row gap-3">
                    <button
                      onClick={onClose}
                      className="order-2 sm:order-1 flex-1 py-3.5 px-6 border border-neutral-300 hover:border-black bg-white hover:bg-neutral-50 text-neutral-700 font-display text-[10px] tracking-[0.2em] font-bold uppercase transition-colors rounded-sm cursor-pointer"
                    >
                      Back to Edit
                    </button>
                    <button
                      onClick={handleFinalizeWhatsAppOrder}
                      className="order-1 sm:order-2 flex-2 py-3.5 px-6 bg-[#1b4332] hover:bg-emerald-950 text-white font-display text-[10px] tracking-[0.25em] font-bold uppercase transition-colors rounded-sm shadow-md flex items-center justify-center space-x-2 cursor-pointer"
                    >
                      <ShoppingBag size={14} className="animate-pulse" />
                      <span>Confirm & Send to WhatsApp</span>
                    </button>
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      }

      // ==========================================
      // PRODUCT DETAIL VIEW
      // ==========================================
      function ProductDetail({ product, onBack, onAddToCart, onOpenConfirmation }) {
        const [selectedShades, setSelectedShades] = useState(
          product.shades && product.shades.length > 0 ? [product.shades[0]] : []
        );
        const [quantity, setQuantity] = useState(1);
        const [copied, setCopied] = useState(false);
        const businessNumber = "2349162093880";

        const hasShades = product.shades && product.shades.length > 0;
        const totalUnits = hasShades ? selectedShades.length * quantity : quantity;
        const totalAmount = product.price * totalUnits;

        const [reviews, setReviews] = useState(() => {
          const saved = localStorage.getItem(`reviews_prod_${product.id}`);
          if (saved) {
            try { return JSON.parse(saved); } catch (e) {}
          }
          return [
            { id: "r1", name: "Chiamaka O.", rating: 4, comment: "Absolutely in love with this! The quality is premium and matches my undertone flawlessly. Perfect for everyday wear.", date: "2 days ago" },
            { id: "r2", name: "Temitope A.", rating: 4, comment: "This is a game changer. Super lightweight, long-lasting, and remarkably affordable for such professional-grade quality.", date: "1 week ago" },
            { id: "r3", name: "Fatima Y.", rating: 4, comment: "Smooth application and excellent pigment payoff. The blendability is pure luxury.", date: "2 weeks ago" }
          ];
        });

        const [ratingInput, setRatingInput] = useState(4);
        const [hoveredRating, setHoveredRating] = useState(null);
        const [nameInput, setNameInput] = useState("");
        const [commentInput, setCommentInput] = useState("");
        const [formSubmitted, setFormSubmitted] = useState(false);

        useEffect(() => {
          const saved = localStorage.getItem(`reviews_prod_${product.id}`);
          if (saved) {
            try { setReviews(JSON.parse(saved)); return; } catch (e) {}
          }
          setReviews([
            { id: "r1", name: "Chiamaka O.", rating: 4, comment: "Absolutely in love with this! The quality is premium and matches my undertone flawlessly. Perfect for everyday wear.", date: "2 days ago" },
            { id: "r2", name: "Temitope A.", rating: 4, comment: "This is a game changer. Super lightweight, long-lasting, and remarkably affordable for such professional-grade quality.", date: "1 week ago" },
            { id: "r3", name: "Fatima Y.", rating: 4, comment: "Smooth application and excellent pigment payoff. The blendability is pure luxury.", date: "2 weeks ago" }
          ]);
        }, [product.id]);

        const handleToggleShade = (shade) => {
          setSelectedShades((prev) => {
            if (prev.includes(shade)) {
              if (prev.length <= 1) return prev;
              return prev.filter((s) => s !== shade);
            } else {
              return [...prev, shade];
            }
          });
        };

        const handleOrderViaWhatsApp = () => {
          if (onOpenConfirmation) {
            onOpenConfirmation(product, selectedShades, quantity);
          }
        };

        const handleCopyLink = () => {
          const url = window.location.href;
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(() => {
              setCopied(true);
              setTimeout(() => setCopied(false), 2500);
            }).catch(() => fallbackCopyText(url));
          } else {
            fallbackCopyText(url);
          }
        };

        const fallbackCopyText = (text) => {
          try {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand("copy");
            document.body.removeChild(textArea);
            setCopied(true);
            setTimeout(() => setCopied(false), 2500);
          } catch (err) {}
        };

        const handleShare = async () => {
          const shareData = {
            title: `Jaydriz Cosmetics - ${product.name}`,
            text: `Check out ${product.name} on Jaydriz Cosmetics!`,
            url: window.location.href,
          };
          if (navigator.share) {
            try { await navigator.share(shareData); } catch (err) {}
          } else {
            handleCopyLink();
          }
        };

        const handleAddReview = (e) => {
          e.preventDefault();
          if (!nameInput.trim() || !commentInput.trim()) return;

          const newReview = {
            id: `r_user_${Date.now()}`,
            name: nameInput.trim(),
            rating: ratingInput,
            comment: commentInput.trim(),
            date: "Just now"
          };

          const updatedReviews = [newReview, ...reviews];
          setReviews(updatedReviews);
          localStorage.setItem(`reviews_prod_${product.id}`, JSON.stringify(updatedReviews));

          setNameInput("");
          setCommentInput("");
          setRatingInput(4);
          setFormSubmitted(true);
          setTimeout(() => setFormSubmitted(false), 4500);
        };

        const totalReviews = reviews.length;
        const averageRating = totalReviews > 0
          ? parseFloat((reviews.reduce((acc, r) => acc + r.rating, 0) / totalReviews).toFixed(1))
          : 4.0;

        const starCounts = [0, 0, 0, 0, 0, 0];
        reviews.forEach((r) => {
          if (r.rating >= 1 && r.rating <= 5) starCounts[r.rating]++;
        });

        const renderStars = (ratingNum, interactive = false, onSelect) => (
          <div className="flex items-center space-x-1">
            {[1, 2, 3, 4, 5].map((star) => {
              const fill = star <= (hoveredRating ?? ratingNum);
              return (
                <button
                  type="button"
                  key={star}
                  disabled={!interactive}
                  onClick={() => onSelect && onSelect(star)}
                  onMouseEnter={() => interactive && setHoveredRating(star)}
                  onMouseLeave={() => interactive && setHoveredRating(null)}
                  className={`transition-transform duration-150 focus:outline-none ${
                    interactive ? "hover:scale-125 cursor-pointer p-0.5" : ""
                  }`}
                >
                  <Star
                    size={interactive ? 24 : 14}
                    className={`${fill ? "fill-amber-400 text-amber-400" : "text-neutral-200 fill-neutral-50"}`}
                  />
                </button>
              );
            })}
          </div>
        );

        return (
          <section className="bg-white py-16 px-6 md:px-12 lg:px-24">
            <button
              onClick={onBack}
              className="inline-flex items-center space-x-2 text-[10px] font-bold uppercase tracking-[0.25em] text-gray-400 hover:text-black transition-colors mb-12 cursor-pointer"
            >
              <ArrowLeft size={12} />
              <span>← Back to Shop</span>
            </button>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-12 lg:gap-20 items-start max-w-6xl mx-auto">
              <div className="aspect-[4/5] bg-neutral-100 border border-neutral-100 overflow-hidden relative rounded-sm">
                <img
                  src={product.image}
                  alt={product.name}
                  className="w-full h-full object-cover object-center"
                />
                <div className="absolute top-4 right-4 bg-white/90 backdrop-blur-xs text-black border border-neutral-100 text-[8px] tracking-widest uppercase py-1 px-3 shadow-xs">
                  Authentic Brand
                </div>
              </div>

              <div className="flex flex-col space-y-8">
                <div>
                  <span className="text-[10px] uppercase tracking-[0.3em] font-bold text-[#806B5F]">
                    {product.category}
                  </span>
                  <h1 className="font-display text-2xl sm:text-3xl text-black font-extrabold tracking-widest uppercase mt-2 mb-4">
                    {product.name}
                  </h1>
                  <div className="flex items-center gap-2 mb-3">
                    {renderStars(Math.round(averageRating))}
                    <span className="text-xs font-semibold text-neutral-600">({reviews.length} reviews)</span>
                  </div>
                  <span className="text-xl font-bold tracking-wide text-[#806B5F]">
                    ₦{product.price.toLocaleString("en-NG")}
                  </span>
                </div>

                <div className="h-[1px] bg-neutral-100 w-full"></div>

                <div className="space-y-4">
                  <h3 className="text-[10px] uppercase tracking-widest font-bold text-gray-400">
                    Product Overview
                  </h3>
                  <p className="text-xs sm:text-sm text-gray-500 leading-relaxed max-w-lg">
                    {product.description}
                  </p>
                </div>

                {/* Shades Selector */}
                {product.shades && product.shades.length > 0 && (
                  <div className="space-y-4">
                    <div className="flex items-center justify-between">
                      <h3 className="text-[10px] uppercase tracking-widest font-bold text-gray-400">
                        Select Accent Shades (Multi-select)
                      </h3>
                      <span className="text-[9px] uppercase tracking-widest bg-amber-50 text-[#806B5F] font-bold px-2.5 py-1 rounded-sm">
                        {selectedShades.length} Selected
                      </span>
                    </div>
                    <div className="flex flex-wrap gap-3 py-1">
                      {product.shades.map((shade) => {
                        const isSelected = selectedShades.includes(shade);
                        const isHex = shade.startsWith("#");
                        const swatchColor = getShadeColor(shade);
                        return (
                          <button
                            key={shade}
                            onClick={() => handleToggleShade(shade)}
                            className={`w-10 h-10 rounded-full border transition-all duration-300 relative focus:outline-none flex items-center justify-center text-white cursor-pointer ${
                              isSelected
                                ? "border-[#806B5F] scale-110 shadow-lg ring-2 ring-[#806B5F]"
                                : swatchColor.toUpperCase() === "#FFFFFF"
                                ? "border-neutral-300 hover:scale-105 hover:border-black shadow-2xs"
                                : "border-gray-250 hover:scale-105 hover:border-black"
                            }`}
                            style={{ backgroundColor: swatchColor }}
                            title={SHADE_NAMES[shade] || (isHex ? shade : `Shade ${shade}`)}
                          >
                            {!isHex ? (
                              <span className={`text-[11px] font-bold font-mono ${swatchColor.toUpperCase() === "#FFFFFF" ? "text-neutral-900 drop-shadow-none" : "drop-shadow"}`}>
                                {shade}
                              </span>
                            ) : null}
                            {isSelected && (
                              <div className="absolute inset-0 flex items-center justify-center bg-black/25 rounded-full">
                                <Check size={14} className="text-white drop-shadow" strokeWidth={3} />
                              </div>
                            )}
                          </button>
                        );
                      })}
                    </div>

                    <div className="bg-neutral-50 p-3.5 rounded-sm border border-neutral-100 flex flex-wrap gap-2 items-center">
                      <span className="text-[9px] text-gray-400 uppercase tracking-wider font-semibold">Chosen Shades:</span>
                      {selectedShades.map((shade) => (
                        <span
                          key={shade}
                          className="inline-flex items-center space-x-1.5 bg-white border border-neutral-200/80 px-2.5 py-1 text-[9px] font-bold tracking-wide rounded-full text-gray-800 shadow-3xs"
                        >
                          <span className="w-2.5 h-2.5 rounded-full border border-gray-100 shrink-0" style={{ backgroundColor: getShadeColor(shade) }}></span>
                          <span>{formatShadeLabel(shade)}</span>
                        </span>
                      ))}
                    </div>
                  </div>
                )}

                <div className="space-y-4">
                  <div className="flex items-center justify-between">
                    <h3 className="text-[10px] uppercase tracking-widest font-bold text-gray-400">
                      {hasShades ? "Configure Multiplier (1 Shade = 1 Unit)" : "Configure Quantity"}
                    </h3>
                    <span className="text-[9px] uppercase tracking-widest font-mono font-bold text-[#806B5F]">
                      {totalUnits} Unit{totalUnits > 1 ? "s" : ""} Total
                    </span>
                  </div>
                  <div className="flex items-center space-x-4">
                    <div className="flex items-center border border-neutral-200">
                      <button
                        onClick={() => quantity > 1 && setQuantity(quantity - 1)}
                        className="px-4 py-2 hover:bg-neutral-50 transition-colors text-xs font-bold cursor-pointer"
                      >
                        -
                      </button>
                      <span className="px-6 py-2 text-xs font-bold font-mono">
                        {quantity}
                      </span>
                      <button
                        onClick={() => setQuantity(quantity + 1)}
                        className="px-4 py-2 hover:bg-neutral-50 transition-colors text-xs font-bold cursor-pointer"
                      >
                        +
                      </button>
                    </div>
                    {hasShades && (
                      <span className="text-[11px] text-neutral-500 font-sans">
                        ({selectedShades.length} shade{selectedShades.length > 1 ? "s" : ""} × {quantity} set{quantity > 1 ? "s" : ""})
                      </span>
                    )}
                  </div>

                  <div className="bg-amber-50/70 border border-amber-200/50 p-3 rounded-sm text-xs space-y-1">
                    <div className="flex items-center justify-between font-semibold text-neutral-800">
                      <span>Order Value:</span>
                      <span className="font-mono text-[#806B5F] font-bold text-sm">
                        ₦{totalAmount.toLocaleString("en-NG")}
                      </span>
                    </div>
                    <p className="text-[10px] text-neutral-500">
                      {hasShades
                        ? `Rule: 1 shade = 1 unit. ${selectedShades.length} shades × ${quantity} set${quantity > 1 ? "s" : ""} = ${totalUnits} units total at ₦${product.price.toLocaleString("en-NG")} each.`
                        : `${quantity} unit${quantity > 1 ? "s" : ""} at ₦${product.price.toLocaleString("en-NG")} each.`}
                    </p>
                  </div>
                </div>

                <div className="space-y-3 pt-4">
                  <div className="flex flex-col sm:flex-row gap-4">
                    <button
                      onClick={handleOrderViaWhatsApp}
                      className="flex-1 bg-emerald-800 hover:bg-emerald-950 text-white font-display text-[10px] tracking-[0.25em] font-bold py-5 px-10 flex items-center justify-center space-x-3 transition-colors duration-300 rounded-sm shadow-md cursor-pointer"
                    >
                      <ShoppingBag size={14} className="animate-bounce" />
                      <span>Order via WhatsApp (₦{totalAmount.toLocaleString("en-NG")})</span>

      // ==========================================
      // MAIN APP COMPONENT
      // ==========================================
      function App() {
        const [currentView, setCurrentView] = useState("home");
        const [selectedProduct, setSelectedProduct] = useState(null);
        const [cart, setCart] = useState([]);
        const [isCartOpen, setIsCartOpen] = useState(false);
        const [confirmingOrder, setConfirmingOrder] = useState(null);
        const [isLoading, setIsLoading] = useState(true);
        const [showScrollTop, setShowScrollTop] = useState(false);
        const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
        const [headerSearchValue, setHeaderSearchValue] = useState("");
        const [searchQuery, setSearchQuery] = useState("");

        const matchingSearchProducts = productsList.filter((p) => {
          const val = headerSearchValue.trim().toLowerCase();
          if (!val) return false;
          return (
            p.name.toLowerCase().includes(val) ||
            p.category.toLowerCase().includes(val) ||
            p.description.toLowerCase().includes(val)
          );
        });

        const handleSearchSubmit = (val) => {
          const queryToSubmit = val !== undefined ? val : headerSearchValue;
          setSearchQuery(queryToSubmit.trim());
          setHeaderSearchValue("");
          setCurrentView("shop");
          setSelectedProduct(null);
          setIsMobileMenuOpen(false);
          window.scrollTo({ top: 0, behavior: "smooth" });
        };

        useEffect(() => {
          const timer = setTimeout(() => setIsLoading(false), 1200);
          const handleScroll = () => setShowScrollTop(window.scrollY > 400);
          window.addEventListener("scroll", handleScroll);
          return () => {
            clearTimeout(timer);
            window.removeEventListener("scroll", handleScroll);
          };
        }, []);

        const handleSelectProduct = (prod) => {
          setSelectedProduct(prod);
          setCurrentView("detail");
          window.scrollTo({ top: 0, behavior: "smooth" });
        };

        const handleAddToCart = (product, selectedShades, quantity) => {
          setCart((prevCart) => {
            const normalizedSelected = (selectedShades || []).slice().sort();
            const existingIdx = prevCart.findIndex((item) => {
              if (item.product.id !== product.id) return false;
              const itemShades = (item.selectedShades || []).slice().sort();
              if (itemShades.length !== normalizedSelected.length) return false;
              return itemShades.every((shade, i) => shade === normalizedSelected[i]);
            });
            if (existingIdx > -1) {
              const updated = [...prevCart];
              updated[existingIdx] = {
                ...updated[existingIdx],
                quantity: updated[existingIdx].quantity + quantity
              };
              return updated;
            } else {
              return [...prevCart, { product, selectedShades: [...(selectedShades || [])], quantity }];
            }
          });
          setIsCartOpen(true);
        };

        const handleUpdateCartQty = (idx, isPlus) => {
          setCart((prevCart) => {
            const updated = [...prevCart];
            if (isPlus) {
              updated[idx] = { ...updated[idx], quantity: updated[idx].quantity + 1 };
            } else {
              if (updated[idx].quantity > 1) {
                updated[idx] = { ...updated[idx], quantity: updated[idx].quantity - 1 };
              } else {
                updated.splice(idx, 1);
              }
            }
            return updated;
          });
        };

        // 1 shade is equivalent to 1 unit logic
        const getItemTotalUnits = (item) => {
          if (item.selectedShades && item.selectedShades.length > 0) {
            return item.selectedShades.length * item.quantity;
          }
          return item.quantity;
        };

        const getItemSubtotal = (item) => {
          return item.product.price * getItemTotalUnits(item);
        };

        const calculateTotalBagUnits = () => {
          return cart.reduce((acc, curr) => acc + getItemTotalUnits(curr), 0);
        };

        const calculateSubtotal = () => {
          return cart.reduce((acc, curr) => acc + getItemSubtotal(curr), 0);
        };

        const handleOpenDirectConfirmation = (product, selectedShades, quantity) => {
          const items = [
            product.shades && product.shades.length > 0
              ? {
                  product,
                  shades: (selectedShades && selectedShades.length > 0 ? selectedShades : [product.shades[0]]).map((s) => ({
                    shade: s,
                    quantity: quantity
                  }))
                }
              : {
                  product,
                  quantity: quantity
                }
          ];
          setConfirmingOrder({ source: "direct", items });
        };

        const handleCheckoutCartViaWhatsApp = () => {
          if (cart.length === 0) return;
          const items = cart.map((item) => {
            if (item.selectedShades && item.selectedShades.length > 0) {
              return {
                product: item.product,
                shades: item.selectedShades.map((s) => ({
                  shade: s,
                  quantity: item.quantity
                }))
              };
            } else {
              return {
                product: item.product,
                quantity: item.quantity
              };
            }
          });
          setConfirmingOrder({ source: "cart", items });
          setIsCartOpen(false);
        };

        return (
          <div className="min-h-screen bg-[#FAF7F5] text-black font-sans flex flex-col justify-between">
            {isLoading && <GlobalLoader />}

            {/* Header Navbar */}
            <header className="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-gray-100 py-5 px-6 md:px-12 flex items-center justify-between font-sans">
              <div className="flex items-center space-x-4">
                <button
                  onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)}
                  className="md:hidden text-black hover:text-[#806B5F] focus:outline-none p-1 cursor-pointer"
                  aria-label="Toggle mobile menu"
                >
                  {isMobileMenuOpen ? <X size={20} /> : <Menu size={20} />}
                </button>

                <button
                  onClick={() => {
                    setCurrentView("home");
                    setSelectedProduct(null);
                    setIsMobileMenuOpen(false);
                  }}
                  className="font-display font-black text-lg tracking-[0.25em] text-black focus:outline-none uppercase cursor-pointer"
                >
                  JAYDRIZ
                </button>
              </div>

              <nav className="hidden md:flex items-center space-x-12">
                <button
                  onClick={() => { setCurrentView("home"); setSelectedProduct(null); }}
                  className={`font-display text-[10px] tracking-[0.25em] font-bold uppercase cursor-pointer transition-colors hover:text-[#806B5F] ${currentView === "home" ? "text-[#806B5F]" : "text-gray-400"}`}
                >
                  Home
                </button>
                <button
                  onClick={() => { setCurrentView("shop"); setSelectedProduct(null); }}
                  className={`font-display text-[10px] tracking-[0.25em] font-bold uppercase cursor-pointer transition-colors hover:text-[#806B5F] ${currentView === "shop" ? "text-[#806B5F]" : "text-gray-400"}`}
                >
                  Shop
                </button>
                <button
                  onClick={() => { setCurrentView("about"); setSelectedProduct(null); }}
                  className={`font-display text-[10px] tracking-[0.25em] font-bold uppercase cursor-pointer transition-colors hover:text-[#806B5F] ${currentView === "about" ? "text-[#806B5F]" : "text-gray-400"}`}
                >
                  About JAYDRIZ
                </button>
                <button
                  onClick={() => { setCurrentView("contact"); setSelectedProduct(null); }}
                  className={`font-display text-[10px] tracking-[0.25em] font-bold uppercase cursor-pointer transition-colors hover:text-[#806B5F] ${currentView === "contact" ? "text-[#806B5F]" : "text-gray-400"}`}
                >
                  Contact us
                </button>
              </nav>

              <div className="flex items-center space-x-3 sm:space-x-6 font-sans">
                <div className="relative">
                  <div className="flex items-center bg-neutral-100 hover:bg-neutral-200/60 border border-neutral-200/30 rounded-sm px-2.5 sm:px-3 py-1.5 transition-colors duration-250 w-28 xs:w-36 sm:w-48 md:w-56 lg:w-64">
                    <Search className="w-3.5 h-3.5 text-neutral-450 mr-2 shrink-0" />
                    <input
                      type="text"
                      placeholder="Search..."
                      value={headerSearchValue}
                      onChange={(e) => setHeaderSearchValue(e.target.value)}
                      onKeyDown={(e) => e.key === "Enter" && handleSearchSubmit()}
                      className="bg-transparent text-[11px] sm:text-xs text-black placeholder-neutral-400 focus:outline-none w-full py-0"
                    />
                    {headerSearchValue && (
                      <button
                        onClick={() => setHeaderSearchValue("")}
                        className="text-[10px] text-neutral-450 hover:text-black ml-1.5 shrink-0 focus:outline-none cursor-pointer"
                      >
                        ✕
                      </button>
                    )}
                  </div>

                  {headerSearchValue.trim() !== "" && (
                    <div className="absolute right-0 top-full mt-2 w-72 sm:w-80 bg-white border border-neutral-200/70 shadow-2xl rounded-sm p-4 z-50 max-h-[380px] overflow-y-auto">
                      <p className="text-[9px] uppercase tracking-widest text-[#806B5F] font-bold border-b border-neutral-100 pb-2 mb-2 text-left">
                        Matching Products ({matchingSearchProducts.length})
                      </p>
                      {matchingSearchProducts.length > 0 ? (
                        <div className="space-y-2">
                          {matchingSearchProducts.slice(0, 5).map((p) => (
                            <div
                              key={p.id}

                                setSelectedProduct(p);

                                setHeaderSearchValue("");

                              className="flex items-center gap-3 p-1.5 hover:bg-neutral-50 rounded-xs cursor-pointer transition-colors"
                            >
                              <img src={p.image} alt={p.name} className="w-10 h-12 object-cover rounded-xs bg-neutral-100 shrink-0" />
                              <div className="flex-grow text-left">
                                <p className="text-xs text-neutral-800 font-semibold truncate leading-tight uppercase">{p.name}</p>
                                <p className="text-[10px] text-neutral-450 uppercase tracking-wider">{p.category}</p>
                              </div>
                              <span className="text-xs font-semibold text-[#806B5F] shrink-0">₦{p.price.toLocaleString("en-NG")}</span>
                            </div>

                          {matchingSearchProducts.length > 5 && (
                            <div className="text-center pt-2 border-t border-gray-100">
                              <button
                                onClick={() => handleSearchSubmit()}
                                className="text-[10px] text-[#806B5F] hover:text-black font-bold tracking-widest uppercase py-1 cursor-pointer"
                              >
                                View All Results
                              </button>
                            </div>
                          )}
                        </div>
                      ) : (
                        <p className="text-xs text-neutral-400 italic py-4 text-center">No products match search.</p>
                      )}
                    </div>
                  )}
                </div>

                <button
                  onClick={() => setIsCartOpen(true)}
                  className="relative flex items-center justify-center p-2 text-black hover:text-[#806B5F] transition-colors focus:outline-none cursor-pointer"
                  id="open-cart-drawer-btn"
                >
                  <ShoppingBag size={20} />
                  {calculateTotalBagUnits() > 0 && (
                    <span className="absolute -top-1 -right-1 bg-black text-white font-mono font-bold text-[8px] h-4 w-4 rounded-full flex items-center justify-center animate-pulse">
                      {calculateTotalBagUnits()}
                    </span>
                  )}
                </button>
              </div>
            </header>

            {/* Mobile Navigation Menu */}
            {isMobileMenuOpen && (
              <div
                onClick={() => setIsMobileMenuOpen(false)}
                className="fixed inset-0 z-40 bg-black/40 backdrop-blur-xs md:hidden"
              >
                <div
                  onClick={(e) => e.stopPropagation()}
                  className="w-4/5 max-w-[300px] h-full bg-white p-6 shadow-2xl flex flex-col justify-between"
                >
                  <div className="space-y-8">
                    <div className="flex items-center justify-between border-b border-neutral-100 pb-4">
                      <span className="font-display font-black text-xs tracking-widest text-black">JAYDRIZ MENU</span>
                      <button onClick={() => setIsMobileMenuOpen(false)} className="text-neutral-500 hover:text-black focus:outline-none p-1 cursor-pointer">
                        <X size={18} />
                      </button>
                    </div>

                    <div className="relative">
                      <div className="flex items-center bg-neutral-50 border border-neutral-200/60 rounded-sm px-3 py-2">
                        <Search className="w-4 h-4 text-neutral-400 mr-2 shrink-0" />
                        <input
                          type="text"
                          placeholder="Search creations..."
                          value={headerSearchValue}
                          onChange={(e) => setHeaderSearchValue(e.target.value)}
                          onKeyDown={(e) => e.key === "Enter" && handleSearchSubmit()}
                          className="bg-transparent text-xs text-black placeholder-neutral-450 focus:outline-none w-full"
                        />
                        {headerSearchValue && (
                          <button
                            onClick={() => setHeaderSearchValue("")}
                            className="text-xs text-neutral-500 hover:text-black ml-2 shrink-0 cursor-pointer"
                          >
                            ✕
                          </button>
                        )}
                      </div>
                    </div>

                    <nav className="flex flex-col space-y-6">
                      <button
                        onClick={() => { setCurrentView("home"); setSelectedProduct(null); setIsMobileMenuOpen(false); window.scrollTo({ top: 0, behavior: "smooth" }); }}
                        className={`font-display text-[10px] tracking-widest font-bold uppercase text-left transition-colors hover:text-[#806B5F] cursor-pointer ${currentView === "home" ? "text-black pl-2 border-l-2 border-black" : "text-gray-400"}`}
                      >
                        Home
                      </button>
                      <button
                        onClick={() => { setCurrentView("shop"); setSelectedProduct(null); setIsMobileMenuOpen(false); window.scrollTo({ top: 0, behavior: "smooth" }); }}
                        className={`font-display text-[10px] tracking-widest font-bold uppercase text-left transition-colors hover:text-[#806B5F] cursor-pointer ${currentView === "shop" ? "text-black pl-2 border-l-2 border-black" : "text-gray-400"}`}
                      >
                        Shop
                      </button>
                      <button
                        onClick={() => { setCurrentView("about"); setSelectedProduct(null); setIsMobileMenuOpen(false); window.scrollTo({ top: 0, behavior: "smooth" }); }}
                        className={`font-display text-[10px] tracking-widest font-bold uppercase text-left transition-colors hover:text-[#806B5F] cursor-pointer ${currentView === "about" ? "text-black pl-2 border-l-2 border-black" : "text-gray-400"}`}
                      >
                        About JAYDRIZ
                      </button>
                      <button
                        onClick={() => { setCurrentView("contact"); setSelectedProduct(null); setIsMobileMenuOpen(false); window.scrollTo({ top: 0, behavior: "smooth" }); }}
                        className={`font-display text-[10px] tracking-widest font-bold uppercase text-left transition-colors hover:text-[#806B5F] cursor-pointer ${currentView === "contact" ? "text-black pl-2 border-l-2 border-black" : "text-gray-400"}`}
                      >

                    <p className="text-[10px] text-neutral-500 leading-relaxed font-light">

                    </p>
                    <div className="flex items-center space-x-3 text-neutral-500 text-xs">
                      <Instagram size={14} />
                      <a href="https://www.instagram.com/jaydrizcosmetics" target="_blank" rel="noopener noreferrer" className="underline hover:text-black">
                        @jaydrizcosmetics
                      </a>
                    </div>
                  </div>
                </div>
              </div>

            {/* Main View Router */}
            <main className="flex-grow">
              {currentView === "home" && (
                <div>
                  <HeroSection onShopNowClick={() => { setCurrentView("shop"); window.scrollTo({ top: 0, behavior: "smooth" }); }} />
                  <Shop
                    products={productsList}
                    onSelectProduct={handleSelectProduct}
                    searchQuery={searchQuery}
                    onClearSearch={() => setSearchQuery("")}
                  />
                  <div className="max-w-7xl mx-auto px-6 mt-16 pb-12">
                    <FAQSection />
                  </div>
                </div>
              )}

              {currentView === "shop" && (
                <Shop
                  products={productsList}
                  onSelectProduct={handleSelectProduct}
                  searchQuery={searchQuery}
                  onClearSearch={() => setSearchQuery("")}
                />
              )}

              {currentView === "about" && <AboutJaydriz />}
              {currentView === "contact" && <Contact onBack={() => setCurrentView("home")} />}

              {currentView === "detail" && selectedProduct && (
                <ProductDetail
                  product={selectedProduct}

                      <ShoppingBag size={18} className="text-[#806B5F]" />

                    </div>

                        <div className="flex items-center justify-between">
                          <span className="font-display text-[10px] tracking-wider uppercase text-neutral-500">Est. Subtotal</span>

                        </div>
                      </div>
                      <button
                        onClick={handleCheckoutCartViaWhatsApp}
                        className="w-full bg-[#1b4332]/95 hover:bg-[#1b4332] text-white py-4 text-[10px] tracking-[0.25em] font-display font-bold uppercase transition-colors duration-300 rounded-sm flex items-center justify-center space-x-2 shadow-md cursor-pointer"
                      >
                        <ShoppingBag size={12} className="animate-pulse" />
                        <span>Order Bag via WhatsApp</span>
                      </button>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* WhatsApp Floating Action Button */}
            <a
              href="https://wa.me/2349162093880?text=Hello%20JAYDRIZ%20COSMETICS,%20I'm%20writing%20to%20inquire%20about%20your%20professional%20beauty%20line%20and%20makeup%20products."
              target="_blank"
              rel="noopener noreferrer"
              className="fixed bottom-6 right-6 z-50 bg-[#25d366]/90 hover:bg-[#25d366] text-white p-4 rounded-full shadow-2xl hover:scale-110 active:scale-95 transition-all duration-300 flex items-center justify-center"
              aria-label="Contact JAYDRIZ on WhatsApp"
            >
              <MessageSquare size={24} />
            </a>

            {/* Footer */}
            <footer className="bg-black text-white pt-16 pb-12 border-t border-neutral-900 mt-auto font-sans">
              <div className="max-w-6xl mx-auto px-6 grid grid-cols-1 md:grid-cols-2 gap-12">
                <div className="space-y-4">
                  <h2 className="font-display text-lg font-black tracking-[0.3em] text-white">
                    JAYDRIZ COSMETICS
                  </h2>
                  <p className="text-[11px] text-white leading-relaxed max-w-sm">
                    Jaydriz Cosmetics is a trailblazing beauty brand designed for the modern makeup enthusiast who refuses to compromise on quality or cost. Merging high-performance formulas with trend-driven innovation, the brand delivers an inclusive, pro-level beauty experience that empowers self-expression for every skin tone and type.
                  </p>
                </div>

                <div className="space-y-4">
                  <h3 className="font-display text-[10px] tracking-[0.3em] font-bold uppercase text-amber-500">
                    Support & Inquiries
                  </h3>
                  <p className="text-[11px] text-white leading-relaxed">
                    WhatsApp Support:{" "}
                    <a href="https://wa.me/2349162093880" target="_blank" rel="noopener noreferrer" className="hover:text-amber-400 text-white font-bold underline font-mono">
                      +234 916 209 3880
                    </a>
                    <br />
                    <span className="text-white font-bold">Address:</span> Shop B012, Rivers Plaza II, Lagos Trade Fair Plaza, Off Lagos - Badagry Expressway, Lagos, Nigeria.
                    <br />
                    <span className="text-white font-bold">Hours:</span> Mon - Sat, 9 AM - 6 PM
                  </p>
                </div>
              </div>

              <div className="max-w-6xl mx-auto px-6 border-t border-neutral-900 mt-12 pt-6 text-center">
                <p className="text-[9px] tracking-widest text-white uppercase">
                  © 2026 JAYDRIZ COSMETICS. All Luxury Rights Reserved.
                </p>
              </div>
            </footer>

            {/* Scroll To Top Button */}
            {showScrollTop && (
              <button
                onClick={() => window.scrollTo({ top: 0, behavior: "smooth" })}
                className="fixed bottom-24 right-8 z-[49] bg-white text-black p-2 rounded-full shadow-md border border-neutral-100 hover:scale-105 active:scale-95 transition-all duration-300 cursor-pointer"
                aria-label="Scroll to top"
              >
                <ArrowUp size={16} />
              </button>
            )}

            {/* Order Confirmation Modal */}
            {confirmingOrder && (
              <OrderConfirmationModal
                order={confirmingOrder}
                onClose={() => setConfirmingOrder(null)}
              />
            )}
          </div>
        );
      }

      // Render root App
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
